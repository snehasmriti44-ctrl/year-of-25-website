<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <!-- CRITICAL FOR AUTOMATIC MOBILE & TABLET RESPONSIVENESS -->
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Year of 25</title> 
    
    <style> 
        /* 1. RESET & BASE STYLES */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        } 

        body { 
            font-family: "Times New Roman", Times, serif; 
            background-color: #ffffff;  
            color: #000000; 
            padding: clamp(15px, 4vw, 50px); 
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        } 

        main {
            flex: 1;
        }

        /* 2. RESPONSIVE NAVIGATION BAR */
        .navbar { 
            display: flex; 
            justify-content: space-between;  
            align-items: center; 
            width: 100%; 
            margin-bottom: clamp(30px, 5vw, 60px); 
            flex-wrap: wrap; 
            gap: 20px;
        } 

        .brand-name { 
            font-size: clamp(1.5rem, 4vw, 2.2rem);  
            text-transform: uppercase; 
            letter-spacing: clamp(3px, 1vw, 6px); 
            font-weight: normal; 
            text-decoration: none; 
            color: #000000; 
        } 

        .right-links { 
            display: flex; 
            gap: clamp(15px, 3vw, 40px);  
            flex-wrap: wrap;
        } 

        .nav-topic { 
            font-size: clamp(0.85rem, 1.5vw, 1.1rem); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            cursor: pointer; 
            text-decoration: none; 
            color: #555555; 
            transition: color 0.3s; 
        } 

        .nav-topic:hover, .active-nav { 
            color: #000000; 
            font-weight: bold; 
        } 

        /* 3. HERO MEDIA SECTION (HERO VIDEO / IMAGE) */
        .hero-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto clamp(30px, 5vw, 50px) auto;
            position: relative;
            overflow: hidden;
            background-color: #f9f9f9;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .hero-media {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: cover;
            display: block;
        }

        /* 4. CTA / ACTION LINK */
        .hero-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto clamp(30px, 5vw, 50px) auto;
            padding: 0 10px;
        }

        .cta-button {
            display: inline-block;
            padding: 12px 35px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.95rem;
            transition: background-color 0.3s, transform 0.2s;
        }

        .cta-button:hover {
            background-color: #333333;
            transform: translateY(-2px);
        }

        /* 5. FOOTER (CONTACT INFO & SHOP ADDRESS) */
        footer {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid #eeeeee;
            font-size: 0.9rem;
            color: #444444;
            letter-spacing: 1px;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .footer-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            line-height: 1.6;
        }

        .info-block strong {
            display: block;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #888888;
            margin-bottom: 2px;
        }

        .copyright {
            font-size: 0.8rem;
            color: #888888;
            margin-top: 10px;
        }

        /* 6. MOBILE SPECIFIC OVERRIDES */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                text-align: center;
                justify-content: center;
                gap: 15px;
            }

            .right-links {
                justify-content: center;
            }

            .hero-media {
                max-height: 50vh;
            }

            .footer-info {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style> 
</head> 
<body> 

    <!-- NAVIGATION -->
    <nav class="navbar"> 
        <a href="index.html" class="brand-name">Year of 25</a> 
        <div class="right-links"> 
            <a href="services.html" class="nav-topic">Our Services</a> 
            <a href="view-our-work.html" class="nav-topic">View Our Work</a> 
        </div> 
    </nav> 

    <!-- MAIN HERO CONTENT -->
    <main>
        <div class="hero-container">
            <!-- Video Hero Banner -->
            <video class="hero-media" autoplay loop muted playsinline poster="images/bg1.jpeg">
                <source src="images/fashion-video.mp4" type="video/mp4">
                <!-- Fallback image if video fails to load or play -->
                <img src="images/bg1.jpeg" alt="Year of 25 Banner" class="hero-media">
            </video>
        </div>

        <div class="hero-content">
            <!-- Shop link substituted where Explore Collection was -->
            <a href="shop.html" class="cta-button">Shop Collection</a>
        </div>
    </main>

    <!-- FOOTER WITH CONTACT INFO & SHOP ADDRESS -->
    <footer>
        <div class="footer-info">
            <div class="info-block">
                <strong>Our Contact</strong>
                <div>yearoftwentyfive@gmail.com</div>
                <div>+91 9955527562</div>
            </div>
            <div class="info-block">
                <strong>Shop Address</strong>
                <div>Year of 25 Design Studio Middle Lane, Dangratoli, Ranchi - 834001</div>
            </div>
        </div>
        <p class="copyright">&copy; Year of 25. All Rights Reserved.</p>
    </footer>

</body> 
</html>
