    <style> 
        /* Base Reset */ 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        } 

        body { 
            font-family: "Times New Roman", Times, serif; 
            background-color: #FFFFFF;  
            color: #000000; 
            padding: clamp(15px, 4vw, 50px); 
            line-height: 1.6;
        } 

        /* TOP BRAND HEADER */ 
        .navbar { 
            display: flex; 
            justify-content: flex-start;  
            align-items: center; 
            width: 100%; 
            max-width: 1200px;
            margin: 0 auto clamp(30px, 5vw, 60px) auto; 
        } 

        .brand-name { 
            font-size: clamp(1.8rem, 4vw, 2.2rem);  
            text-transform: uppercase; 
            letter-spacing: clamp(4px, 1vw, 6px); 
            font-weight: normal; 
            text-decoration: none; 
            color: #000000; 
        } 

        /* MAIN LAYOUT CONTAINER */
        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* PRODUCT GRID SECTION */ 
        .shop-heading { 
            font-size: clamp(1.4rem, 3vw, 1.8rem); 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: clamp(25px, 4vw, 40px); 
            font-weight: normal; 
        } 

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: clamp(30px, 4vw, 50px) clamp(20px, 3vw, 30px);  
        } 

        .product-card { 
            display: flex; 
            flex-direction: column; 
        } 

        /* CAROUSEL & IMAGE CONTAINER */ 
        .product-image-wrapper { 
            position: relative; 
            width: 100%; 
            height: 420px;  
            overflow: hidden; 
            background-color: #F9F9F9; 
            margin-bottom: 15px; 
        } 

        /* Slide Container */ 
        .carousel-slides { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.4s ease-in-out; 
        } 

        .carousel-slides img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            flex-shrink: 0; 
        } 

        /* Single Image Contain Style for Unzoomed Display */
        .single-product-img {
            width: 100%;
            height: 100%;
            object-fit: contain !important;
            padding: 10px;
        }

        /* Nav Arrows */ 
        .carousel-arrow { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            background-color: rgba(255, 255, 255, 0.85); 
            border: none; 
            color: #000000; 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.1rem; 
            font-weight: bold; 
            z-index: 2; 
            transition: background-color 0.3s, opacity 0.3s; 
            opacity: 0.8; 
        } 

        .product-image-wrapper:hover .carousel-arrow { 
            opacity: 1; 
        } 

        .carousel-arrow:hover { 
            background-color: rgba(255, 255, 255, 1); 
        } 

        .arrow-left { 
            left: 10px; 
        } 

        .arrow-right { 
            right: 10px; 
        } 

        /* PRODUCT INFO */ 
        .product-info { 
            display: flex; 
            justify-content: space-between; 
            font-size: 1rem; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            margin-bottom: 12px; 
        } 

        .product-price { 
            color: #666666; 
            font-family: sans-serif; 
        } 

        /* SIZE & ORDER INTERACTIVE ELEMENTS */ 
        .order-controls { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        } 

        .size-dropdown { 
            width: 100%; 
            padding: 10px; 
            font-family: "Times New Roman", Times, serif; 
            font-size: 1rem; 
            border: 1px solid #CCCCCC; 
            background-color: #FFFFFF; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            outline: none; 
        } 

        .whatsapp-btn { 
            width: 100%; 
            padding: 12px; 
            background-color: #000000;  
            color: #FFFFFF; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 0.9rem; 
            border: none; 
            cursor: pointer; 
            transition: background-color 0.3s; 
        } 

        .whatsapp-btn:hover { 
            background-color: #111111; 
            opacity: 0.9; 
        } 

        /* RESPONSIVE OVERRIDES */
        @media (max-width: 768px) {
            .navbar {
                justify-content: center;
                text-align: center;
            }

            .shop-heading {
                text-align: center;
            }

                height: 380px;
            }

            .carousel-arrow {
                opacity: 1; 
            }
        }
    </style>

    <!-- CAROUSEL SLIDING & WHATSAPP LOGIC --> 
    <script> 
        // Track the current index for each carousel 
        var carouselStates = { 
            'carousel-1': { index: 0, count: 3 }, 
            'carousel-2': { index: 0, count: 3 }, 
            'carousel-3': { index: 0, count: 3 }, 
            'carousel-4': { index: 0, count: 3 } 
        }; 

        function moveSlide(carouselId, direction) { 
            var state = carouselStates[carouselId]; 
            var container = document.getElementById(carouselId); 
            var slidesWrapper = container.querySelector('.carousel-slides'); 
             
            // Calculate new index 
            state.index += direction; 
            if (state.index >= state.count) { 
                state.index = 0; // Loop back to start 
            } else if (state.index < 0) { 
                state.index = state.count - 1; // Loop to end 
            } 
             
            // Translate the slides container 
            var offset = -state.index * 100; 
            slidesWrapper.style.transform = 'translateX(' + offset + '%)'; 
        } 

        function sendWhatsAppOrder(productName, sizeDropdownId) { 
            var selectedSize = document.getElementById(sizeDropdownId).value; 
            var phoneNumber = "919955527562";  
            var customMessage = "Hello Year of 25! I would like to order: " + productName + " in Size: " + selectedSize + ". Please let me know the next steps!"; 
            var encodedMessage = encodeURIComponent(customMessage); 
            var whatsappUrl = "https://wa.me/" + phoneNumber + "?text=" + encodedMessage; 
            window.open(whatsappUrl, '_blank'); 
        } 
    </script>
