<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>View Our Work - Year of 25</title> 
    <style> 
        /* Base Reset */ 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        } 
 
        body { 
            font-family: "Times New Roman", Times, serif; 
            background-color: #FFFFFF;  
            color: #000000; 
            padding: clamp(15px, 4vw, 50px); 
            line-height: 1.6;
        } 
 
        /* TOP BRAND HEADER */ 
        .navbar { 
            display: flex; 
            justify-content: flex-start;  
            align-items: center; 
            width: 100%; 
            max-width: 1200px;
            margin: 0 auto clamp(30px, 5vw, 60px) auto; 
        } 
 
        .brand-name { 
            font-size: clamp(1.8rem, 4vw, 2.2rem);  
            text-transform: uppercase; 
            letter-spacing: clamp(4px, 1vw, 6px); 
            font-weight: normal; 
            text-decoration: none; 
            color: #000000; 
        } 
 
        /* LARGE VERTICAL PORTFOLIO LAYOUT */ 
        .portfolio-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center;  
            gap: clamp(30px, 5vw, 60px); /* Responsive space between each large photo */ 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
        } 
 
        .portfolio-heading { 
            align-self: flex-start; 
            font-size: clamp(1.4rem, 3vw, 1.8rem); 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 10px; 
            font-weight: normal; 
            width: 100%; 
        } 
 
        .work-image-wrapper { 
            width: 100%; 
            max-width: 900px; /* Keeps layout clean and sharp on wide desktop monitors */ 
            background-color: #F9F9F9; 
            overflow: hidden; 
        } 
 
        .work-image-wrapper img { 
            width: 100%; 
            height: auto;  
            display: block; 
            object-fit: contain; 
        } 

        /* RESPONSIVE OVERRIDES */
        @media (max-width: 768px) {
            .navbar {
                justify-content: center;
                text-align: center;
            }

            .portfolio-heading {
                text-align: center;
            }
        }
    </style> 
</head> 
<body> 
 
    <!-- TOP BRAND HEADER --> 
    <header class="navbar"> 
        <a href="index.html" class="brand-name">Year of 25</a> 
    </header> 
 
    <!-- PORTFOLIO DISPLAY --> 
    <main class="portfolio-container"> 
        <h2 class="portfolio-heading">Our Work</h2> 
         
        <!-- Image 1 --> 
        <div class="work-image-wrapper"> 
            <img src="images/ourwork1.jpeg" alt="Year of 25 - Editorial 1"> 
        </div> 
 
        <!-- Image 2 --> 
        <div class="work-image-wrapper"> 
            <img src="images/ourwork2.jpeg" alt="Year of 25 - Editorial 2"> 
        </div> 
 
        <!-- Image 3 --> 
        <div class="work-image-wrapper"> 
            <img src="images/ourwork3.jpeg" alt="Year of 25 - Editorial 3"> 
        </div> 
 
        <!-- Image 4 --> 
        <div class="work-image-wrapper"> 
            <img src="images/ourwork4.jpeg" alt="Year of 25 - Editorial 4"> 
        </div> 
 
        <!-- Image 5 --> 
        <div class="work-image-wrapper"> 
            <img src="images/ourwork5.jpeg" alt="Year of 25 - Editorial 5"> 
        </div>        
 
        <!-- Image 6 --> 
        <div class="work-image-wrapper"> 
            <img src="images/ourwork6.jpeg" alt="Year of 25 - Editorial 6"> 
        </div> 
    </main> 
</body> 
</html>
